
services:
  api:
    image: ecommerce-api:latest
    build:
        context: .
        dockerfile: Dockerfile
    container_name: ecommerce-api

    restart: unless-stopped

    ports:
      - "5001:8083"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__ApplicationConnection: ${DB_CONNECTION}

      Minio__Endpoint: ${Minio__Endpoint}
      Minio__AccessKey: ${Minio__AccessKey}
      Minio__SecretKey: ${Minio__SecretKey}
      Minio__BucketName: ${Minio__BucketName}
      Minio__UseSSL: ${Minio__UseSSL}
      Minio__PublicUrl: ${Minio__PublicUrl}
      
      
      SmsProvider__ApiKey: ${SmsProvider__ApiKey}
      SmsProvider__Number: ${SmsProvider__Number}
      SmsProvider__Username: ${SmsProvider__Username}
      SmsProvider__HostAddress: ${SmsProvider__HostAddress}
      SmsProvider__Endpoint: ${SmsProvider__Endpoint}
      
      EmailProvider__FromEmail: ${EmailProvider__FromEmail}
      EmailProvider__Password: ${EmailProvider__Password}
      EmailProvider__Username: ${EmailProvider__Username}
      EmailProvider__SmtpAddress: ${EmailProvider__SmtpAddress}
      EmailProvider__SmtpPort: ${EmailProvider__SmtpPort}
      EmailProvider__SenderName: ${EmailProvider__SenderName}
      
      Google__ClientId: ${Google__ClientId}
      Google__ClientSecret: ${Google__ClientSecret}

      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__AccessTokenExpirationMinutes: ${Jwt__AccessTokenExpirationMinutes}
      Jwt__RefreshTokenExpirationDays: ${Jwt__RefreshTokenExpirationDays}
      
      AdminConfigs__password: ${AdminConfigs__password}
      AdminConfigs__phoneNumber: ${AdminConfigs__phoneNumber}
      AdminConfigs__email: ${AdminConfigs__email}
      AdminConfigs__username: ${AdminConfigs__username}
      AdminConfigs__firstName: ${AdminConfigs__firstName}
      AdminConfigs__lastName: ${AdminConfigs__lastName}
      
      

    depends_on:
      - sqlserver
      - minio

    networks:
      - ecommerce-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ecommerce-sql

    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}

    volumes:
        - sqlserver_data:/var/opt/mssql
      
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - ecommerce-network

  minio:
    image: minio/minio:RELEASE.2023-10-07T15-07-38Z
    container_name: ecommerce-minio

    command: server /data --console-address ":9001"

    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${Minio__AccessKey}
      MINIO_ROOT_PASSWORD: ${Minio__SecretKey}

    volumes:
      - ./volumes/minio:/data

    ports:
      - "9000:9000"
      - "9001:9001"

    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  sqlserver_data: